{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="preload" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css"></noscript>

<!-- Support for Font Awesome -->
 <link rel="preload" href="{{ base_path }}/assets/css/fontawesome.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{ base_path }}/assets/css/fontawesome.css"></noscript>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="var(--global-bg-color)"/>

<script>
  window.MathJax = {
    tex: { inlineMath: [['$','$'], ['\\(','\\)']] },
    options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code','annotation','annotation-xml'] }
  };
</script>
<script id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<script>
  (function () {
    var t = localStorage.getItem("theme");
    if (t === "dark" || t === "twilight") {
      document.documentElement.setAttribute("data-theme", t);
    }
  })();
</script>

<script>
  window.addEventListener("load", function () {
    var ORDER = ["light", "twilight", "dark"];
    var ICONS = { light: "fa-sun", twilight: "fa-cloud-moon", dark: "fa-moon" };

    function current() {
      var t = document.documentElement.getAttribute("data-theme");
      return (t === "dark" || t === "twilight") ? t : "light";
    }

    function paint(theme) {
      if (theme === "light") {
        document.documentElement.removeAttribute("data-theme");
      } else {
        document.documentElement.setAttribute("data-theme", theme);
      }
      var icon = document.getElementById("theme-icon");
      if (icon) { icon.className = "fa-solid " + ICONS[theme]; }
    }

    paint(current());

    var toggle = document.getElementById("theme-toggle");
    if (!toggle) { return; }

    if (window.jQuery) { window.jQuery(toggle).off("click"); }

    toggle.addEventListener("click", function (e) {
      e.preventDefault();
      var next = ORDER[(ORDER.indexOf(current()) + 1) % ORDER.length];
      paint(next);
      localStorage.setItem("theme", next);
    });
  });
</script>

<!-- end custom head snippets -->
